<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pink MTProxy</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    overflow:hidden;

    display:flex;
    justify-content:center;
    align-items:center;

    font-family:Arial,sans-serif;

    /* 🔥 Новый сочный розово-малиновый градиент */
    background:
    radial-gradient(circle at top left,#ff1493,#c71585 50%,#8b0a50 90%);
}

/* блестки */

.sparkle{
    position:absolute;
    width:6px;
    height:6px;
    background:white;
    border-radius:50%;
    opacity:.8;
    animation:float 6s linear infinite;
    box-shadow:
    0 0 10px white,
    0 0 20px #fff,
    0 0 30px #ffb7f7;
}

/* 🌟 ЗВЁЗДОЧКИ 🌟 */
.star{
    position:absolute;
    font-size:24px;
    opacity:0.8;
    animation:twinkle 3s ease-in-out infinite;
    pointer-events:none;
    user-select:none;
    z-index:5;
}

/* большая звезда */
.star-big{
    position:absolute;
    font-size:36px;
    opacity:0.9;
    animation:twinkle 4s ease-in-out infinite;
    pointer-events:none;
    user-select:none;
    z-index:5;
}

@keyframes twinkle{
    0%{ opacity:0.2; transform:scale(0.7); text-shadow:0 0 0px gold; }
    50%{ opacity:1; transform:scale(1.3); text-shadow:0 0 20px gold, 0 0 5px pink; }
    100%{ opacity:0.2; transform:scale(0.7); text-shadow:0 0 0px gold; }
}

@keyframes float{
    from{
        transform:translateY(100vh) scale(.4);
        opacity:0;
    }

    20%{
        opacity:1;
    }

    to{
        transform:translateY(-20vh) scale(1.2);
        opacity:0;
    }
}

.box{
    position:relative;
    z-index:10;

    width:420px;

    background:rgba(255,255,255,.15);

    backdrop-filter:blur(18px);

    border:1px solid rgba(255,255,255,.3);

    border-radius:28px;

    padding:30px;

    box-shadow:
    0 10px 40px rgba(255,20,147,.5),
    0 0 80px rgba(255,192,203,.3);

    text-align:center;
}

h1{
    margin-top:0;
    font-size:32px;

    background:linear-gradient(90deg,#fff,#ffccff);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

p{
    color:#fff;
    line-height:1.6;
}

button{
    width:100%;
    padding:18px;

    border:none;
    border-radius:18px;

    background:
    linear-gradient(
        90deg,
        #ff1493,
        #ff69b4
    );

    color:white;

    font-size:19px;
    font-weight:bold;

    cursor:pointer;

    transition:.25s;

    box-shadow:
    0 0 20px rgba(255,20,147,.6),
    0 0 50px rgba(255,105,180,.4);
}

button:hover{
    transform:scale(1.03);
}

button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none !important;
}

.log{
    margin-top:20px;

    background:rgba(255,255,255,.1);

    border-radius:18px;

    padding:14px;

    height:180px;

    overflow:auto;

    text-align:left;

    color:white;

    font-size:13px;

    white-space:pre-wrap;
    word-break:break-word;
}

</style>
</head>

<script>

// ========== 🔥 ТВОИ 3 ПРОКСИ (встроены прямо сюда) ==========
const proxiesList = [
    "https://t.me/proxy?server=63.141.235.116&port=55926&secret=ee2178ab6116682f125599ffb878d873d07777772e636c6f7564666c6172652e636f6d",
    "https://t.me/proxy?server=63.141.235.117&port=53807&secret=ee23bc62708fcbb1f8ca0a8f434a00ab0b7777772e676f6f676c652e636f6d",
    "https://t.me/proxy?server=63.141.235.118&port=51604&secret=ee31614092079b07e9ff937dbdbd1083647777772e6d6963726f736f66742e636f6d"
];

let isImporting = false;
const log = document.getElementById("log");
const importBtn = document.getElementById("importBtn");

function addLog(text){
    log.textContent += text + "\n";
    log.scrollTop = log.scrollHeight;
}

function sleep(ms){
    return new Promise(r => setTimeout(r, ms));
}

async function startImport() {
    if (isImporting) {
        addLog("⚠️ Импорт уже выполняется, подожди...");
        return;
    }
    
    isImporting = true;
    importBtn.disabled = true;
    
    addLog(`✨ Начинаю импорт ${proxiesList.length} прокси...`);
    addLog(`💖 Сейчас откроется Telegram (если он установлен)`);
    
    for(let i = 0; i < proxiesList.length; i++){
        
        addLog(`📡 Открываю proxy #${i+1}`);
        
        // преобразуем https://t.me/proxy... в tg://proxy... для прямого открытия в Telegram
        const tgUrl = proxiesList[i].replace("https://t.me/proxy", "tg://proxy");
        
        // открываем прокси в Telegram
        window.location.href = tgUrl;
        
        // ждём 3 секунды перед следующим
        await sleep(3000);
    }
    
    addLog("✨ Готово! Все прокси добавлены ✨");
    addLog("💡 Если Telegram не открылся — проверь, что он установлен");
    
    importBtn.disabled = false;
    isImporting = false;
}

importBtn.addEventListener("click", startImport);

// приветствие при загрузке
addLog("🎀 Pink MTProxy готов к работе!");
addLog(`📋 Найдено ${proxiesList.length} прокси-сервера`);
addLog("💖 Нажми на кнопку, чтобы добавить их в Telegram");

</script>
