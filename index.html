<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pink MTProxy — Живые прокси</title>
<style>
*{box-sizing:border-box;}
body{margin:0;min-height:100vh;overflow:hidden;display:flex;justify-content:center;align-items:center;font-family:Arial,sans-serif;background:radial-gradient(circle at top left,#ffe4e1,#ffb6c1 50%,#ffc0cb 90%);}
.sparkle{position:absolute;width:6px;height:6px;background:white;border-radius:50%;opacity:.8;animation:float 6s linear infinite;box-shadow:0 0 10px white,0 0 20px #fff,0 0 30px #ffb7f7;}
@keyframes float{from{transform:translateY(100vh) scale(.4);opacity:0;}20%{opacity:1;}to{transform:translateY(-20vh) scale(1.2);opacity:0;}}
.box{position:relative;z-index:10;width:420px;background:rgba(255,255,255,.25);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.4);border-radius:28px;padding:30px;box-shadow:0 10px 40px rgba(255,105,180,.3),0 0 80px rgba(255,192,203,.4);text-align:center;}
h1{margin-top:0;font-size:32px;background:linear-gradient(90deg,#8b1a3a,#6b0f2a);-webkit-background-clip:text;-webkit-text-fill-color:transparent;opacity:1;}
p{color:#6b0f2a;line-height:1.6;text-shadow:none;font-weight:500;}
button{width:100%;padding:18px;border:none;border-radius:18px;background:linear-gradient(90deg,#ffb6c1,#ffc0cb);color:#6b0f2a;font-size:19px;font-weight:bold;cursor:pointer;transition:.25s;box-shadow:0 0 20px rgba(255,182,193,.6),0 0 50px rgba(255,192,203,.4);}
button:hover{transform:scale(1.03);}
button:disabled{opacity:0.6;cursor:not-allowed;transform:none !important;}
.log{margin-top:20px;background:rgba(255,250,245,0.2);border-radius:18px;padding:14px;height:180px;overflow:auto;text-align:left;color:#5a0a23;font-size:13px;white-space:pre-wrap;word-break:break-word;backdrop-filter:blur(4px);font-weight:500;}
</style>
</head>
<body>

<!-- ТОЛЬКО БЛЁСТКИ (все звёздочки удалены) -->
<div class="sparkle" style="left:3%;animation-delay:0s"></div>
<div class="sparkle" style="left:12%;animation-delay:2s"></div>
<div class="sparkle" style="left:22%;animation-delay:1s"></div>
<div class="sparkle" style="left:32%;animation-delay:3s"></div>
<div class="sparkle" style="left:42%;animation-delay:5s"></div>
<div class="sparkle" style="left:52%;animation-delay:2s"></div>
<div class="sparkle" style="left:62%;animation-delay:4s"></div>
<div class="sparkle" style="left:72%;animation-delay:1s"></div>
<div class="sparkle" style="left:82%;animation-delay:6s"></div>
<div class="sparkle" style="left:92%;animation-delay:3s"></div>
<div class="sparkle" style="left:8%;animation-delay:1.5s"></div>
<div class="sparkle" style="left:48%;animation-delay:3.5s"></div>
<div class="sparkle" style="left:78%;animation-delay:2.8s"></div>
<div class="sparkle" style="left:15%;animation-delay:0.7s"></div>
<div class="sparkle" style="left:35%;animation-delay:4.2s"></div>
<div class="sparkle" style="left:58%;animation-delay:1.3s"></div>
<div class="sparkle" style="left:88%;animation-delay:5.1s"></div>
<div class="sparkle" style="left:68%;animation-delay:2.4s"></div>
<div class="sparkle" style="left:98%;animation-delay:0.9s"></div>

<div class="box">
<h1>💖 MTProxy 💖</h1>
<p>Нажми кнопку чтобы добавить все рабочие proxy в Telegram ✨</p>
<button id="importBtn">🎀 тык 🎀</button>
<div class="log" id="log"></div>
</div>

<script>
const log = document.getElementById("log");
const importBtn = document.getElementById("importBtn");

// 🔥 СВЕЖИЕ ИСТОЧНИКИ ПРОВЕРЕННЫХ ПРОКСИ 🔥
const PROXY_SOURCES = [
    "https://raw.githubusercontent.com/kort0881/telegram-proxy-collector/main/verified/proxy_links_tme_clean.txt",
    "https://raw.githubusercontent.com/SoliSpirit/mtproto/master/all_proxies.txt"
];

let proxies = [];
let isImporting = false;

function addLog(text){
    log.textContent += text + "\n";
    log.scrollTop = log.scrollHeight;
}

function sleep(ms){
    return new Promise(r => setTimeout(r, ms));
}

// Загружаем прокси из всех источников
async function loadProxies() {
    addLog("📡 Загружаю свежие списки прокси...");
    const allProxies = new Set();
    
    for (const source of PROXY_SOURCES) {
        try {
            addLog(`  🔍 Проверяю источник: ${source.split("/").slice(-1)}`);
            const response = await fetch(source);
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            
            const text = await response.text();
            const lines = text.split(/\r?\n/);
            
            let found = 0;
            for (let line of lines) {
                line = line.trim();
                if (line.startsWith("https://t.me/proxy") || line.startsWith("tg://proxy")) {
                    let normalized = line;
                    if (normalized.startsWith("tg://proxy")) {
                        normalized = "https://t.me/proxy?" + normalized.split("?")[1];
                    }
                    allProxies.add(normalized);
                    found++;
                }
            }
            addLog(`    ✅ Найдено ${found} прокси в этом источнике`);
        } catch (error) {
            addLog(`    ⚠️ Ошибка загрузки: ${error.message}`);
        }
    }
    
    proxies = Array.from(allProxies).slice(0, 15);
    addLog(`🎀 Всего загружено уникальных прокси: ${proxies.length}`);
    
    if (proxies.length === 0) {
        addLog("❌ Не удалось загрузить прокси. Попробуй позже.");
    } else {
        addLog(`💖 Готово! Найдено ${proxies.length} прокси. Нажимай кнопку!`);
    }
}

async function startImport() {
    if (isImporting) {
        addLog("⚠️ Импорт уже идёт, подожди...");
        return;
    }
    
    if (proxies.length === 0) {
        addLog("❌ Список прокси пуст. Перезагрузи страницу.");
        return;
    }
    
    isImporting = true;
    importBtn.disabled = true;
    
    addLog(`✨ Начинаю импорт ${proxies.length} прокси...`);
    
    for(let i = 0; i < proxies.length; i++){
        addLog(`📡 Открываю proxy #${i+1}`);
        const tgUrl = proxies[i].replace("https://t.me/proxy", "tg://proxy");
        window.location.href = tgUrl;
        await sleep(2800);
    }
    
    addLog("✨ Готово! Все прокси добавлены ✨");
    addLog("💡 Если какие-то не работают — перезагрузи страницу, я подтяну свежие!");
    
    importBtn.disabled = false;
    isImporting = false;
}

importBtn.addEventListener("click", startImport);

// Загружаем прокси при старте
addLog("🎀 Pink MTProxy загружается...");
loadProxies().then(() => {
    if (proxies.length > 0) {
        addLog(`💖 Нажми «тык», чтобы добавить ${proxies.length} прокси в Telegram`);
    }
});
</script>
</body>
</html>
