<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pink MTProxy</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    overflow:hidden;

    display:flex;
    justify-content:center;
    align-items:center;

    font-family:Arial,sans-serif;

    background:
    radial-gradient(circle at top left,#ff4fd8,#ff91f5 30%,#ffc8f6 70%);
}

/* блестки */

.sparkle{
    position:absolute;
    width:6px;
    height:6px;
    background:white;
    border-radius:50%;
    opacity:.8;
    animation:float 6s linear infinite;
    box-shadow:
    0 0 10px white,
    0 0 20px #fff,
    0 0 30px #ffb7f7;
}

@keyframes float{
    from{
        transform:translateY(100vh) scale(.4);
        opacity:0;
    }

    20%{
        opacity:1;
    }

    to{
        transform:translateY(-20vh) scale(1.2);
        opacity:0;
    }
}

.box{
    position:relative;
    z-index:10;

    width:420px;

    background:rgba(255,255,255,.15);

    backdrop-filter:blur(18px);

    border:1px solid rgba(255,255,255,.25);

    border-radius:28px;

    padding:30px;

    box-shadow:
    0 10px 40px rgba(255,0,170,.4),
    0 0 80px rgba(255,255,255,.15);

    text-align:center;
}

h1{
    margin-top:0;
    font-size:32px;

    background:linear-gradient(90deg,#fff,#ffd3f8);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

p{
    color:#fff;
    line-height:1.6;
}

button{
    width:100%;
    padding:18px;

    border:none;
    border-radius:18px;

    background:
    linear-gradient(
        90deg,
        #ff2ebd,
        #ff7be5
    );

    color:white;

    font-size:19px;
    font-weight:bold;

    cursor:pointer;

    transition:.25s;

    box-shadow:
    0 0 20px rgba(255,0,170,.6),
    0 0 50px rgba(255,150,220,.4);
}

button:hover{
    transform:scale(1.03);
}

.log{
    margin-top:20px;

    background:rgba(255,255,255,.1);

    border-radius:18px;

    padding:14px;

    height:180px;

    overflow:auto;

    text-align:left;

    color:white;

    font-size:13px;

    white-space:pre-wrap;
}

.loading-indicator {
    margin-top: 15px;
    color: white;
    font-size: 12px;
    display: none;
}

</style>
</head>

<body>

<!-- блестки -->

<div class="sparkle" style="left:5%;animation-delay:0s"></div>
<div class="sparkle" style="left:15%;animation-delay:2s"></div>
<div class="sparkle" style="left:25%;animation-delay:1s"></div>
<div class="sparkle" style="left:35%;animation-delay:3s"></div>
<div class="sparkle" style="left:45%;animation-delay:5s"></div>
<div class="sparkle" style="left:55%;animation-delay:2s"></div>
<div class="sparkle" style="left:65%;animation-delay:4s"></div>
<div class="sparkle" style="left:75%;animation-delay:1s"></div>
<div class="sparkle" style="left:85%;animation-delay:6s"></div>
<div class="sparkle" style="left:95%;animation-delay:3s"></div>

<div class="box">

<h1>💖 MTProxy 💖</h1>

<p>
Нажми кнопку ниже чтобы добавить все proxy в Telegram ✨
</p>

<button onclick="startImport()">
💎 Добавить Proxy 💎
</button>

<div class="log" id="log"></div>
<div class="loading-indicator" id="loading">🔄 Загрузка списка прокси...</div>

</div>

<script>

// ========== НАСТРОЙКИ ==========
// Ссылка на файл с прокси
const PROXY_FILE_URL = "https://raw.githubusercontent.com/SoliSpirit/mtproto/master/all_proxies.txt";

// МАКСИМАЛЬНОЕ КОЛИЧЕСТВО УНИКАЛЬНЫХ ПРОКСИ
const MAX_PROXIES = 10;
// ================================

let proxies = [];

const log = document.getElementById("log");
const loadingIndicator = document.getElementById("loading");

function addLog(text){
    log.textContent += text + "\n";
    log.scrollTop = log.scrollHeight;
}

function sleep(ms){
    return new Promise(r=>setTimeout(r,ms));
}

// Загрузка уникальных прокси из файла (без дубликатов)
async function loadProxiesFromFile() {
    try {
        loadingIndicator.style.display = "block";
        addLog("📡 Загружаю список прокси из файла...");
        
        const response = await fetch(PROXY_FILE_URL);
        
        if (!response.ok) {
            throw new Error(`Ошибка HTTP: ${response.status}`);
        }
        
        const text = await response.text();
        
        // Разбиваем текст на строки
        const lines = text.split(/\r?\n/);
        
        // Используем Set для автоматического удаления дубликатов
        const uniqueProxiesSet = new Set();
        
        for (let line of lines) {
            line = line.trim();
            // Пропускаем пустые строки
            if (line === "") continue;
            
            // Проверяем, что это ссылка прокси
            if (line.startsWith("https://t.me/proxy")) {
                // Добавляем в Set (дубликаты автоматически отсеются)
                uniqueProxiesSet.add(line);
            }
            
            // Если уже набрали достаточно уникальных - можно выйти
            if (uniqueProxiesSet.size >= MAX_PROXIES) break;
        }
        
        // Преобразуем Set обратно в массив
        const uniqueProxies = Array.from(uniqueProxiesSet);
        
        if (uniqueProxies.length === 0) {
            throw new Error("В файле не найдено ни одной ссылки прокси");
        }
        
        // Берём первые MAX_PROXIES (хотя Set уже ограничен, но на всякий случай)
        proxies = uniqueProxies.slice(0, MAX_PROXIES);
        
        const duplicatesFiltered = uniqueProxiesSet.size !== proxies.length ? " (были удалены дубликаты)" : "";
        addLog(`✅ Загружено уникальных прокси: ${proxies.length} из ${uniqueProxiesSet.size} найденных${duplicatesFiltered}`);
        
        loadingIndicator.style.display = "none";
        return true;
        
    } catch (error) {
        console.error("Ошибка загрузки:", error);
        addLog(`❌ Ошибка загрузки файла: ${error.message}`);
        addLog(`💡 Проверь интернет или ссылку`);
        loadingIndicator.style.display = "none";
        return false;
    }
}

async function startImport(){
    
    if (proxies.length === 0) {
        addLog("❌ Список прокси пуст!");
        addLog("💡 Попробуйте обновить страницу");
        return;
    }
    
    addLog(`✨ Начинаю импорт ${proxies.length} уникальных прокси...`);
    
    for(let i = 0; i < proxies.length; i++){
        
        addLog(`💖 Открываю proxy #${i+1}`);
        
        const tgUrl = proxies[i].replace(
            "https://t.me/proxy",
            "tg://proxy"
        );
        
        // Открываем прокси в Telegram
        window.location.href = tgUrl;
        
        // Ждём 3.5 секунды перед следующим
        await sleep(3500);
    }
    
    addLog("✨ Готово! ✨");
}

// При загрузке страницы — загружаем уникальные прокси из файла
(async function init() {
    const success = await loadProxiesFromFile();
    if (!success || proxies.length === 0) {
        addLog("⚠️ Не удалось загрузить прокси. Проверь интернет или ссылку.");
    } else {
        addLog(`🎀 Страница готова! Нажми кнопку для импорта ${proxies.length} уникальных прокси`);
    }
})();

</script>

</body>
</html>
